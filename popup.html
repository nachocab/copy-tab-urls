<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body style="font: 13px system-ui; padding: 8px; white-space: nowrap">
    <style>
      kbd {
        font: inherit;
        color: #666;
        margin-left: 4px;
      }
    </style>
    <div id="msg">Copying…</div>
    <div id="options" style="margin-top: 6px" hidden>
      <button data-format="urlOnly" data-label="URL" data-command="copy-urls">URLs only</button>
      <button data-format="markdown" data-label="link" data-command="copy-markdown">Markdown / Teams</button>
    </div>
    <!-- type="module" is required for the top-level await in popup.js -->
    <script type="module" src="popup.js"></script>
  </body>
</html>
